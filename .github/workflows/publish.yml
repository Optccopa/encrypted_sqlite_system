name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build Source Distribution and Wheel
      run: |
        python -m build

    - name: Verify package archives with Twine
      run: |
        twine check dist/*

    - name: Publish package to PyPI
      # Uses PyPI Trusted Publishing (OIDC) - no API token secret required.
      # Configure once at https://pypi.org/manage/account/publishing/ :
      #   owner: Yannis-A-D, repo: encrypted_sqlite_system, workflow: publish.yml
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
